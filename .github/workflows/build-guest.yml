name: Build Guest

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - .github/workflows/build-guest.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Makefile
      - Dockerfile
      - build-guest.sh
      - crates/circuits/types/**/*
      - crates/types/**/*
      - crates/circuits/chunk-circuit/**/*
      - crates/circuits/batch-circuit/**/*
      - crates/circuits/bundle-circuit/**/*
      - crates/build-guest/**/*
  push:
    branches:
      - master
      - dogeos/main
      - release/*
    paths:
      - .github/workflows/build-guest.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Makefile
      - Dockerfile
      - build-guest.sh
      - crates/circuits/types/**/*
      - crates/types/**/*
      - crates/circuits/chunk-circuit/**/*
      - crates/circuits/batch-circuit/**/*
      - crates/circuits/bundle-circuit/**/*
      - crates/build-guest/**/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-guest:
    name: Docker containerized build of guest programs
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      BUILD_PROJECT: chunk
      CARGO_BUILD_JOBS: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the benchmarked execution change
        uses: actions/checkout@v4
        with:
          repository: DogeOS69/dogeos-revm
          ref: 44b8bf4471595e59a954190f9aab175c43546b59
          path: benchmark-revm
          persist-credentials: false

      - name: Build guest and check diff
        run: |
          git -C benchmark-revm diff --exit-code
          git -C benchmark-revm rev-parse HEAD > guest-build-revm-source.txt
          make build-guest
          git diff
          git diff --exit-code -- Cargo.toml Cargo.lock rust-toolchain.toml Dockerfile

      - name: Record guest build provenance
        if: always()
        run: |
          git rev-parse HEAD > guest-build-source.txt
          git diff --binary > guest-build.diff
          sha256sum Cargo.lock rust-toolchain.toml Dockerfile > guest-build-inputs.sha256

      - name: Upload guest programs and generated commitments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-build-${{ github.sha }}
          path: |
            releases/dev/
            guest-build-source.txt
            guest-build-revm-source.txt
            guest-build.diff
            guest-build-inputs.sha256
          if-no-files-found: error
          retention-days: 14
